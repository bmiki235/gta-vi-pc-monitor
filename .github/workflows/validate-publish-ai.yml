name: AI-elemzés ellenőrzése és publikálása

on:
  # Az automatikus futtatás csak a kézi tesztek után engedélyezhető.
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      candidate_branch:
        description: 'Claude branch (üresen: legfrissebb új elemzés automatikus keresése)'
        required: false
        default: ''
        type: string
      publish:
        description: 'Érvényes fájl publikálása a main branchre'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: gta-ai-publication
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
    steps:
      - name: Megbízható main branch betöltése
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validátor telepítése
        run: python -m pip install 'jsonschema[format]==4.23.0'
      - name: Új elemzés keresése és kizárólag az adatfájl lekérése
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CANDIDATE_BRANCH" ]]; then
            case "$CANDIDATE_BRANCH" in
              claude/*) ;;
              *) echo 'Csak claude/ kezdetű branch engedélyezett.'; exit 1 ;;
            esac
            git check-ref-format "refs/heads/$CANDIDATE_BRANCH"
            git fetch --no-tags --depth=1 origin "refs/heads/$CANDIDATE_BRANCH"
            git show FETCH_HEAD:ai_analysis.json > "$RUNNER_TEMP/ai_candidate.json"
            echo 'found=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin '+refs/heads/claude/*:refs/remotes/origin/claude/*'
          python - <<'PYTHON'
          import json, os, subprocess
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          def timestamp(value):
              result = datetime.fromisoformat(value.replace('Z', '+00:00'))
              if result.tzinfo is None:
                  raise ValueError('Hiányzó időzóna')
              return result

          baseline = Path('ai_analysis.json')
          previous = timestamp(json.loads(baseline.read_text(encoding='utf-8'))['checked_at']) if baseline.exists() else datetime.min.replace(tzinfo=timezone.utc)
          refs = subprocess.check_output(['git', 'for-each-ref', '--format=%(refname)', 'refs/remotes/origin/claude/'], text=True).splitlines()
          candidates = []
          for ref in refs:
              obj = ref + ':ai_analysis.json'
              try:
                  size = int(subprocess.check_output(['git','cat-file','-s',obj], stderr=subprocess.DEVNULL))
                  if size > 2_000_000:
                      continue
                  raw = subprocess.check_output(['git','show',obj], stderr=subprocess.DEVNULL)
                  data = json.loads(raw)
                  checked = timestamp(data['checked_at'])
                  if previous < checked <= datetime.now(timezone.utc) + timedelta(minutes=2):
                      candidates.append((checked, ref, raw))
              except (subprocess.CalledProcessError, ValueError, TypeError, KeyError, AttributeError, OverflowError):
                  continue
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              if not candidates:
                  print('Nincs újabb, feldolgozható elemzés. A publikált fájl változatlan.')
                  output.write('found=false\n')
              else:
                  checked, ref, raw = max(candidates, key=lambda row: (row[0], row[1]))
